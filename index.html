<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="appTitle">Notiz App</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="category.js" defer></script>
    <script src="richTextEditor.js" defer></script>
    <script src="language.js" defer></script>
    <script src="darkmode.js" defer></script>
    <script src="notesApi.js" defer></script>
    <script src="app.js" defer></script>
  </head>

  <body>
    <section class="welcome-screen">
      <div class="welcome-screen__content">
        <div class="welcome-screen__icon">✎</div>
        <h1 class="welcome-screen__title">Notes</h1>
        <p class="welcome-screen__description">
          Your personal space for thoughts.
        </p>
        <div class="welcome-screen__prompt">PRESS ENTER TO CONTINUE</div>
      </div>
    </section>
    <div class="app-container">
      <aside class="note-sidebar">
        <button class="button button--add-note" onclick="addNewNote()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="button__icon"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <span data-i18n="addNote">Neue Notiz erstellen</span>
        </button>

        <div class="note-overview"></div>
      </aside>

      <main class="editor-container">
        <div class="editor__toolbar">
          <input
            type="text"
            id="note-heading"
            class="editor__title"
            data-i18n-placeholder="placeholderHeading"
            placeholder="Überschrift eingeben..."
          />

          <button
            class="button button--action"
            aria-label="Notiz speichern"
            data-i18n-aria-label="saveNote"
            onclick="saveNote()"
            id="store-btn"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="button__icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 8.25H7.5a2.25 2.25 0 00-2.25 2.25v9a2.25 2.25 0 002.25 2.25h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25H15M9 12l3 3m0 0l3-3m-3 3V2.25"
              />
            </svg>
          </button>

          <button
            class="button button--action"
            aria-label="Notiz löschen"
            data-i18n-aria-label="deleteNote"
            onclick="deleteNote()"
            id="delete-btn"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="button__icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"
              />
            </svg>
          </button>

          <button
            class="button button--action button--darkmode"
            aria-label="Darkmode aktivieren"
            active="false"
            onclick="toggleDarkmode()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="button__icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
              />
            </svg>
          </button>
        </div>

        <div class="format-toolbar">
          <button
            type="button"
            data-command="bold"
            title="Fett"
            class="format-toolbar__button"
          >
            <strong>B</strong>
          </button>
          <button
            type="button"
            data-command="italic"
            title="Kursiv"
            class="format-toolbar__button"
          >
            <em>I</em>
          </button>
          <button
            type="button"
            data-command="underline"
            title="Unterstrichen"
            class="format-toolbar__button"
          >
            <u>U</u>
          </button>
          <button
            type="button"
            data-command="insertUnorderedList"
            title="Aufzählung"
            class="format-toolbar__button"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="format-toolbar__icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
              />
            </svg>
          </button>
          <button
            type="button"
            data-command="insertOrderedList"
            title="Nummerierte Liste"
            class="format-toolbar__button"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="format-toolbar__icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8.242 5.992h12m-12 6.003H20.24m-12 5.999h12M4.117 7.495v-3.75H2.99m1.125 3.75H2.99m1.125 0H5.24m-1.92 2.577a1.125 1.125 0 1 1 1.591 1.59l-1.83 1.83h2.16M2.99 15.745h1.125a1.125 1.125 0 0 1 0 2.25H3.74m0-.002h.375a1.125 1.125 0 0 1 0 2.25H2.99"
              />
            </svg>
          </button>
        </div>

        <div
          id="note-text"
          class="editor__text"
          contenteditable="true"
          data-i18n-placeholder="placeholderText"
          data-placeholder="Fang an, deine Notizen aufzuschreiben..."
        ></div>
      </main>
    </div>
    <div id="popup" class="popup">
      <p id="popup-message" data-i18n="noNotesFound">
        Es wurden keine Notizen gefunden im LocalStorage. Bitte erstelle eine
        Notiz.
      </p>
      <button
        onclick="
          document.querySelector('#popup').classList.remove('popup--active')
        "
      >
        OK
      </button>
    </div>
  </body>
</html>
